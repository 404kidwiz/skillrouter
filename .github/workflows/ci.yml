name: CI

on:
  push:
    branches: [main, "ci/**"] # ci/* branches get the full matrix before they reach main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20 # a hung test (a leaked handle keeps its process alive) must fail the job, not hold it for hours
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]
        include:
          # The hooks are developed on macOS; one run there catches platform-only breakage.
          - os: macos-latest
            node: 22
          # Hooks, launcher and installer run on Windows; the warm service does not yet, so its tests skip there.
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # pnpm 11 itself needs Node 22.13+, so install on 22, then switch to the matrix version for the tests.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-node@v4
        if: matrix.node != 22
        with:
          node-version: ${{ matrix.node }}

      - name: Build and run tests
        run: npm test

      - name: Routing eval on the bundled fixture (lexical; no model download in CI)
        run: node dist/src/cli.js eval --ci
